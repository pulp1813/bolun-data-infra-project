[project]
name = "nyc_ems"

[source]
type = "socrata"
# Sort before applying the row cap. The second key breaks timestamp ties.
url = "https://data.cityofnewyork.us/resource/76xm-jjuj.json"
columns = [
  "incident_id", "incident_datetime", "borough", "zipcode",
  "dispatch_response_seconds_qy", "incident_travel_tm_seconds_qy",
  "incident_response_seconds_qy", "valid_incident_rspns_time_indc"
]
filter = "incident_datetime >= '2023-10-01T00:00:00'"
max_rows = 200

[[checks]]
name = "200 incidents and all five NYC boroughs"
why = "A short sample or missing borough would limit a five-borough comparison."
sql = """
SELECT CASE WHEN count(*) = 200
             AND count(DISTINCT borough_name) FILTER (
                 WHERE borough_name IN ('BRONX', 'BROOKLYN', 'MANHATTAN', 'QUEENS', 'STATEN ISLAND')
             ) = 5
            THEN 0 ELSE 1 END
FROM (
    SELECT CASE WHEN borough = 'RICHMOND / STATEN ISLAND' THEN 'STATEN ISLAND'
                ELSE borough END AS borough_name
    FROM raw
) AS normalized
"""

[[checks]]
name = "Incident IDs are present and unique"
why = "Each call must be counted once."
sql = "SELECT count(*) - count(DISTINCT nullif(trim(CAST(incident_id AS VARCHAR)), '')) FROM raw"

[[checks]]
name = "Valid response times are present and nonnegative"
why = "A record marked valid needs a usable duration for the response-time comparison."
sql = """
SELECT count(*) FROM raw WHERE valid_incident_rspns_time_indc = 'Y'
AND (try_cast(incident_response_seconds_qy AS BIGINT) IS NULL
     OR try_cast(incident_response_seconds_qy AS BIGINT) < 0)
"""

[[checks]]
name = "Response validity flags are Y or N"
why = "An unexpected or missing flag makes it unclear whether to use the response time."
sql = """
SELECT count(*) FROM raw WHERE valid_incident_rspns_time_indc IS NULL
OR valid_incident_rspns_time_indc NOT IN ('Y','N')
"""

[[checks]]
name = "The sample reaches October 2023 or later"
why = "A sample entirely before the study period would be too old for this project."
sql = """
SELECT CASE WHEN max(try_cast(incident_datetime AS TIMESTAMP)) >= DATE '2023-10-01'
THEN 0 ELSE 1 END FROM raw
"""

[[tables]]
name = "ems_nyc_sample"
sql = """
SELECT CAST(incident_id AS VARCHAR) AS incident_id,
       try_cast(incident_datetime AS TIMESTAMP) AS incident_datetime,
       CASE WHEN borough = 'RICHMOND / STATEN ISLAND' THEN 'STATEN ISLAND'
     ELSE borough END AS borough,
CAST(zipcode AS VARCHAR) AS zipcode,
       try_cast(dispatch_response_seconds_qy AS BIGINT) AS dispatch_response_seconds_qy,
       try_cast(incident_travel_tm_seconds_qy AS BIGINT) AS incident_travel_tm_seconds_qy,
       try_cast(incident_response_seconds_qy AS BIGINT) AS incident_response_seconds_qy,
       valid_incident_rspns_time_indc
FROM raw
"""

[[tables]]
name = "ems_borough_summary"
sql = """
SELECT borough, count(*) AS sample_incidents,
       count(*) FILTER (WHERE valid_incident_rspns_time_indc = 'Y') AS valid_incidents,
       round(median(incident_response_seconds_qy)
             FILTER (WHERE valid_incident_rspns_time_indc = 'Y') / 60.0, 2) AS median_response_min
FROM ems_nyc_sample GROUP BY borough
"""

[[tables]]
name = "ems_borough_day"
sql = """
SELECT CAST(incident_datetime AS DATE) AS incident_day, borough, count(*) AS sample_incidents
FROM ems_nyc_sample GROUP BY incident_day, borough
"""

[[report]]
question = "How many sampled incidents and valid response times does each borough have, and what is its median response in minutes?"
sql = "SELECT * FROM ems_borough_summary ORDER BY median_response_min DESC NULLS LAST, borough"

[[report]]
question = "How many incidents in the sample fall on each date?"
sql = "SELECT incident_day, sum(sample_incidents) AS sample_incidents FROM ems_borough_day GROUP BY incident_day ORDER BY incident_day"
